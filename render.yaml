services:
  - type: web
    name: bloodlink-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app" --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bloodlink-db
          property: connectionString

databases:
  - name: bloodlink-db
    databaseName: bloodlink
    user: bloodlink_admin
